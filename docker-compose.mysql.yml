# inkanboard (inslopnia fork of Kanboard) with MariaDB
#
#   docker compose -f docker-compose.mysql.yml up -d --build
#   open http://localhost:8001/  (admin / admin on first start)
#
# Change the passwords below before exposing this anywhere.
name: inkanboard-mysql
services:
  app:
    build:
      context: .
      args:
        VERSION: ${INKANBOARD_VERSION:-inslopnia}
    image: ${INKANBOARD_IMAGE:-inkanboard:local}
    container_name: inkanboard
    restart: unless-stopped
    ports:
      # localhost only by default; INKANBOARD_BIND=0.0.0.0 publishes it on every interface
      - "${INKANBOARD_BIND:-127.0.0.1}:${INKANBOARD_PORT:-8001}:80"
    volumes:
      - data:/var/www/app/data
      - plugins:/var/www/app/plugins
    environment:
      DATABASE_URL: mysql://kanboard:kanboard-secret@db/kanboard
    depends_on:
      db:
        condition: service_healthy
  db:
    # pinned: MariaDB 12+ names implicit foreign keys `1`, `2`… instead of `<table>_ibfk_N`,
    # which breaks Kanboard's old schema migrations (version_75: DROP FOREIGN KEY comments_ibfk_2)
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: kanboard
      MARIADB_USER: kanboard
      MARIADB_PASSWORD: kanboard-secret
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  data:
  plugins:
  db:
