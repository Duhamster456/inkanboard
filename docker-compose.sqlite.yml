# inkanboard (inslopnia fork of Kanboard) with SQLite
#
#   docker compose -f docker-compose.sqlite.yml up -d --build
#   open http://localhost:8001/  (admin / admin on first start)
#
# The image is built from this repository, so the inslopnia theme is included.
# Rebuild the CSS first if you changed assets/css/src: php cli css
# Another host port: INKANBOARD_PORT=9000 docker compose -f docker-compose.sqlite.yml up -d
name: inkanboard
services:
  app:
    build:
      context: .
      args:
        VERSION: ${INKANBOARD_VERSION:-inslopnia}
    image: ${INKANBOARD_IMAGE:-inkanboard:local}
    container_name: inkanboard
    restart: unless-stopped
    ports:
      - "${INKANBOARD_PORT:-8001}:80"
    volumes:
      - data:/var/www/app/data
      - plugins:/var/www/app/plugins
volumes:
  data:
  plugins:
