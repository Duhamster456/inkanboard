# inkanboard (inslopnia fork of Kanboard) with PostgreSQL
#
#   docker compose -f docker-compose.postgres.yml up -d --build
#   open http://localhost:8001/  (admin / admin on first start)
#
# Change the passwords below before exposing this anywhere.
name: inkanboard-postgres
services:
  app:
    build:
      context: .
      args:
        VERSION: ${INKANBOARD_VERSION:-inslopnia}
    image: ${INKANBOARD_IMAGE:-inkanboard:local}
    container_name: inkanboard
    restart: unless-stopped
    ports:
      - "${INKANBOARD_PORT:-8001}:80"
    volumes:
      - data:/var/www/app/data
      - plugins:/var/www/app/plugins
    environment:
      DATABASE_URL: postgres://kanboard:kanboard-secret@db/kanboard
    depends_on:
      db:
        condition: service_healthy
  db:
    # pinned: postgres 18+ images expect the volume at /var/lib/postgresql instead
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanboard
      POSTGRES_PASSWORD: kanboard-secret
      POSTGRES_DB: kanboard
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kanboard"]
      start_period: 15s
      interval: 10s
      timeout: 5s
volumes:
  data:
  plugins:
  db:
